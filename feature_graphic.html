<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, height=500">
    <title>Feature Graphic - Aquatech CRM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, #036BB2 0%, #025A9A 50%, #014A7F 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .logo {
            width: 400px;
            margin-bottom: 20px;
        }
        .title {
            font-size: 48px;
            font-weight: 700;
            color: white;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 24px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 30px;
        }
        .tagline {
            font-size: 18px;
            color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.1);
            padding: 10px 25px;
            border-radius: 25px;
            display: inline-block;
        }
        .phone-mockup {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            width: 180px;
            height: 320px;
            background: #111;
            border-radius: 25px;
            border: 8px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .phone-screen {
            width: 155px;
            height: 290px;
            background: linear-gradient(180deg, #036BB2, #025A9A);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .phone-icon {
            font-size: 40px;
        }
        .phone-text {
            color: white;
            font-size: 10px;
            text-align: center;
        }
        .decoration {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }
        .decoration-1 {
            top: -100px;
            left: -100px;
        }
        .decoration-2 {
            bottom: -150px;
            right: -50px;
            width: 400px;
            height: 400px;
        }
        .wrench {
            position: absolute;
            font-size: 60px;
            opacity: 0.15;
        }
        .wrench-1 {
            top: 30px;
            left: 200px;
        }
        .wrench-2 {
            bottom: 50px;
            left: 100px;
        }
    </style>
</head>
<body>
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    <div class="wrench wrench-1">🔧</div>
    <div class="wrench wrench-2">⚙️</div>
    
    <div class="phone-mockup">
        <div class="phone-screen">
            <div class="phone-icon">📱</div>
            <div class="phone-text">CRM<br>Aquatech</div>
        </div>
    </div>
    
    <div class="container">
        <img src="logo.jpg" alt="Aquatech" class="logo">
        <div class="title">AQUATECH CRM</div>
    </div>
</body>
</html>
